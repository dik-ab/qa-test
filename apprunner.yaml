version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - echo "Installing dependencies"
      - npm ci
      - echo "Building application"
      - npm run build
run:
  runtime-version: 18
  command: npm start
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: AWS_REGION
      value: ap-northeast-1
    - name: PORT
      value: "3000"
    # Google Cloud Document AI環境変数はDockerイメージのbuild時に設定される
    # GOOGLE_SERVICE_ACCOUNT_KEY, GOOGLE_CLOUD_PROJECT_ID, DOCUMENT_AI_LOCATION, DOCUMENT_AI_PROCESSOR_ID
